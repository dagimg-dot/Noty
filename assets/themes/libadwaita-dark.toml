[meta]
name = "Adwaita Dark"
description = "GNOME LibAdwaita inspired dark theme"
variant = "dark"
inherits = "noty-dark"

[colors.accents]
blue = "#3584e4"
green = "#3a944a"
magenta = "#d56199"
orange = "#ed5b00"
red = "#e62d42"
yellow = "#c88800"
cyan = "#2190a4"
purple = "#9141ac"

[colors.core]
accent = "colors.accents.blue"
accent_foreground = "colors.accents.blue"
background = "#222226"
foreground = "#ffffff"
secondary_background = "#2e2e32"
border = "#4A4A53"

[colors.main_window]
border = "colors.core.border"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "#48484c"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default = "colors.core.foreground"
muted = "#c0bfbc"
danger = "#ff938c"
success = "#78e9ab"
placeholder = "#77767b"
selection = { background = "colors.core.accent", foreground = "#ffffff" }

[colors.text.links]
default = "#81d0ff"
visited = "#fba7ff"

[colors.input]
border = "#48484c"
border_focus = "colors.core.accent"
border_error = "#ff938c"

[colors.button.primary]
background = "#2e2e32"
foreground = "#ffffff"
hover = { background = "#bb2e2e32" }
focus = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground = "#ffffff"
secondary_foreground = "#c0bfbc"

[colors.list.item.selection]
background = "#4a4a4f"
foreground = "#ffffff"
secondary_background = "colors.core.accent"
secondary_foreground = "#ffffff"

[colors.grid.item]
background = "#424248"
hover = { outline = "colors.core.accent" }
selection = { outline = "colors.core.accent" }

[colors.scrollbars]
background = "#48484c"

[colors.loading]
bar = "colors.core.accent"
spinner = "#ffffff"
