[package]
name = "noty"
version = "0.5.0"
edition = "2024"
description = "A minimal keyboard driven note taking application"
license = "GPL-3.0-or-later"
repository = "https://github.com/dagimg-dot/noty"
publish = false

[dependencies]
anyhow = "1"
dirs = "6"
gpui-kit = { version = "=0.7.0", features = ["tree-sitter-markdown", "tree-sitter-markdown-inline"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
debug = false
strip = true
