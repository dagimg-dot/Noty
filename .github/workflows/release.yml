name: Noty release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: "Build Linux ${{ matrix.arch }}"
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libfreetype-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build binary and tarball
        run: make dist
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: noty-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    name: "Create Release"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List files
        run: ls -la dist
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
